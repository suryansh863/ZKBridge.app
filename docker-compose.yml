version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zkbridge-postgres
    environment:
      POSTGRES_DB: zkbridge
      POSTGRES_USER: zkbridge
      POSTGRES_PASSWORD: zkbridge123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - zkbridge-network
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkbridge -d zkbridge"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: zkbridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zkbridge-network
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: zkbridge-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://zkbridge:zkbridge123@postgres:5432/zkbridge
      REDIS_URL: redis://redis:6379
      PORT: 3001
      BITCOIN_RPC_HOST: host.docker.internal
      BITCOIN_RPC_PORT: 18332
      BITCOIN_RPC_USER: bitcoin
      BITCOIN_RPC_PASSWORD: password
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL}
      ETHEREUM_PRIVATE_KEY: ${ETHEREUM_PRIVATE_KEY}
      NODE_OPTIONS: "--max-old-space-size=384"
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - ./packages:/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zkbridge-network
    command: npm run dev
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: zkbridge-frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_OPTIONS: "--max-old-space-size=384"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
      - ./packages:/packages
    depends_on:
      - backend
    networks:
      - zkbridge-network
    command: npm run dev
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:

networks:
  zkbridge-network:
    driver: bridge
