<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge Spark - Cross-Chain Bridge</title>
    <link rel="stylesheet" href="hero-animation.css">
</head>
<body>
    <section class="hero">
        <!-- Animated Background Layer -->
        <div class="hero-bg-animation">
            <!-- Connection nodes (dots) -->
            <div class="node node-1"></div>
            <div class="node node-2"></div>
            <div class="node node-3"></div>
            <div class="node node-4"></div>
            <div class="node node-5"></div>
            <div class="node node-6"></div>
            <div class="node node-7"></div>
            <div class="node node-8"></div>
            <div class="node node-9"></div>
            <div class="node node-10"></div>
            
            <!-- Connection lines -->
            <div class="line line-1"></div>
            <div class="line line-2"></div>
            <div class="line line-3"></div>
            <div class="line line-4"></div>
            <div class="line line-5"></div>
            <div class="line line-6"></div>
        </div>

        <!-- Hero Content -->
        <div class="hero-content">
            <h1>Bridge Spark</h1>
            <p>Seamless Cross-Chain Asset Transfer</p>
            <button class="cta-button">Launch App</button>
        </div>
    </section>
</body>
</html>
