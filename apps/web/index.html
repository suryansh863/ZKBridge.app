<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <!-- SEO -->
    <title>ZKBridge - Bitcoin-Ethereum Trustless Bridge</title>
    <meta name="description" content="A trustless bridge between Bitcoin and Ethereum using Zero-Knowledge proofs. Secure, fast, and completely decentralized." />
    <meta name="keywords" content="Bitcoin, Ethereum, Bridge, ZK Proofs, Blockchain, DeFi, Zero-Knowledge, Cryptocurrency" />
    <meta name="author" content="ZKBridge Team" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZKBridge" />
    <meta property="og:title" content="ZKBridge - Bitcoin-Ethereum Trustless Bridge" />
    <meta property="og:description" content="A trustless bridge between Bitcoin and Ethereum using Zero-Knowledge proofs" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZKBridge - Bitcoin-Ethereum Trustless Bridge" />
    <meta name="twitter:description" content="A trustless bridge between Bitcoin and Ethereum using Zero-Knowledge proofs" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ZKBridge" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts & Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.blockstream.info" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Critical CSS to prevent FOUC -->
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      .loading { opacity: 0.7; }
      .fade-in { animation: fadeIn 0.3s ease-in; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .theme-transition { transition: background-color 0.3s ease, color 0.3s ease; }
    </style>
  </head>
  <body>
    <!-- Polyfills for wagmi/rainbowkit -->
    <script>
      if (typeof window.global === 'undefined') {
        window.global = window;
      }
    </script>
    <script type="module">
      import { Buffer } from 'buffer';
      window.Buffer = Buffer;
      window.process = { env: { NODE_ENV: 'development' } };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
